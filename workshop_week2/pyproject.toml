# pyproject.toml

# pyproject.toml - Cấu hình đơn giản cho Maya Chatbot
# 🎯 Dành cho người mới bắt đầu

[tool.ruff]
# ✅ Độ dài dòng - Tuân thủ PEP 8 standard
line-length = 79

# Target Python version  
target-version = "py311"

# Files to check
include = ["*.py", "*.pyi"]

# Files to ignore
exclude = [
    ".venv",
    "__pycache__",
    "build",
    "dist", 
    ".git",
    "node_modules",
]

[tool.ruff.lint]
# 🎯 Quy tắc cơ bản - không quá phức tạp
select = [
    "E",   # Lỗi cú pháp (pycodestyle errors)
    "W",   # Cảnh báo (pycodestyle warnings)  
    "F",   # Logic errors (pyflakes)
    "I",   # Import sorting (isort)
]

# 🚫 Bỏ qua các lỗi không quan trọng
ignore = [
    "E501",  # Line too long (để formatter tự xử lý)
    "E203",  # Whitespace before ':' 
]

# 📁 Rules cho từng loại file
[tool.ruff.lint.per-file-ignores]
# Test files - thoải mái hơn
"test_*.py" = ["E501", "F401"]
"*_test.py" = ["E501", "F401"]

# Demo files - cho phép print
"demo_*.py" = ["T201", "E501"]
"example_*.py" = ["T201", "E501"]

[tool.ruff.lint.isort]
# 📦 Import sorting đơn giản
combine-as-imports = true
split-on-trailing-comma = true

# Sắp xếp imports
known-third-party = [
    "streamlit",
    "flask", 
    "openai",
    "pandas",
    "torch",
    "transformers",
    "pygame",
    "requests",
    "python-dotenv"
]

[tool.ruff.format]
# ✨ Formatting - đơn giản và nhất quán
quote-style = "single"        # Dùng nháy đơn
indent-style = "space"        # Dùng space
line-ending = "auto"          # Tự động detect

# 💡 Tips cho người mới:
# 1. Chạy `ruff check .` để kiểm tra lỗi
# 2. Chạy `ruff format .` để format code
# 3. Line length = 79 là chuẩn PEP 8
# 4. Ignore E501 để tránh conflict với formatter
