# Ruff Configuration File
# Cấu hình formatter và linter cho project Python

# Formatting Configuration
line-length = 88
indent-width = 4
target-version = "py310"

[lint]
# Enable rules
select = [
    # Pyflakes
    "F",
    # pycodestyle
    "E", "W",
    # isort
    "I",
    # pep8-naming
    "N",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-bandit
    "S",
    # flake8-simplify
    "SIM",
    # Perflint
    "PERF",
]

# Ignore specific rules
ignore = [
    "E501",   # Line too long (handled by formatter)
    "S101",   # Use of assert
    "S301",   # pickle usage
    "B008",   # Do not perform function calls in argument defaults
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Exclude files/directories
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "__pycache__",
]

# Per-file ignores
[lint.per-file-ignores]
"__init__.py" = ["F401"]  # Ignore unused imports in __init__.py

[lint.isort]
force-single-line = false
force-sort-within-sections = false
lines-after-imports = 2
known-first-party = ["app"]

[lint.mccabe]
max-complexity = 10

[format]
# Use double quotes for strings
quote-style = "single"
# Use tabs or spaces for indentation
indent-style = "space"
# Skip magic trailing commas
skip-magic-trailing-comma = false
# Automatically detect line ending
line-ending = "auto"
